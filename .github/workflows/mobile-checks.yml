name: SecureID Mobile Checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
  push:
    branches:
      - "feature/native-mobile-app"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo export --platform android
