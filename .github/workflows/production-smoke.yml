name: SecureID production smoke test

on:
  workflow_run:
    workflows: ["SecureID CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: read

concurrency:
  group: secureid-production-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public routes, security headers, and unauthenticated access
        env:
          BASE_URL: https://secureid-production-b732.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.BASE_URL);
          if (base.protocol !== "https:") throw new Error("Production smoke tests must use HTTPS.");

          const routes = [
            { path: "/", type: "text/html" },
            { path: "/manifest.webmanifest", type: "manifest-json" },
            { path: "/service-worker.js", type: "javascript" },
            { path: "/secureid-app-icon.svg", type: "image/svg+xml" },
            { path: "/delete-account.html", type: "text/html", expectedText: "Delete your SecureID account" },
            { path: "/play-store-feature-graphic.svg", type: "image/svg+xml", expectedText: "Your documents." },
            { path: "/api/health", type: "json" },
            { path: "/api/health/ready", type: "json" },
            { path: "/api/__smoke_unknown_route__", type: "json", expectedStatus: 404 },
            { path: "/api/auth/session", type: "json", expectedStatus: 401 },
            { path: "/api/privacy", type: "json", expectedStatus: 401 },
            { path: "/api/identity/government-verification/readiness", type: "json", expectedStatus: 401 },
            { path: "/api/share/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", type: "json", expectedStatus: 404 },
          ];

          let failed = false;
          for (const route of routes) {
            let lastError;
            const maxAttempts = route.path === "/api/health" ? 16 : 3;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                const response = await fetch(new URL(route.path, base), {
                  redirect: "follow",
                  signal: AbortSignal.timeout(15000),
                  headers: { "User-Agent": "SecureID-production-smoke/1.0" },
                });
                const contentType = response.headers.get("content-type") || "";
                const securityHeaders = [
                  ["x-content-type-options", "nosniff"],
                  ["x-frame-options", "DENY"],
                  ["referrer-policy", "strict-origin-when-cross-origin"],
                  ["content-security-policy", "default-src"],
                  ["strict-transport-security", "max-age="],
                ];
                for (const [header, expected] of securityHeaders) {
                  const value = response.headers.get(header) || "";
                  // Public share-token endpoints deliberately suppress referrers to reduce bearer-token leakage.
                  const validShareReferrerPolicy = header === "referrer-policy"
                    && route.path.startsWith("/api/share/")
                    && value.toLowerCase() === "no-referrer";
                  if (!validShareReferrerPolicy && !value.toLowerCase().includes(expected.toLowerCase())) {
                    throw new Error(`Missing or invalid security header: ${header}`);
                  }
                }
                if (route.path.startsWith("/api/")) {
                  const cacheControl = response.headers.get("cache-control") || "";
                  if (!cacheControl.toLowerCase().includes("no-store")) {
                    throw new Error("Sensitive API response is missing Cache-Control: no-store");
                  }
                }
                const body = await response.text();
                if (route.expectedStatus !== undefined ? response.status !== route.expectedStatus : !response.ok) {
                  throw new Error(`Expected HTTP ${route.expectedStatus ?? "2xx"}, got ${response.status}`);
                }
                if (route.type === "json" && !contentType.includes("application/json")) {
                  throw new Error(`Expected JSON content type, got ${contentType || "missing"}`);
                }
                if (route.type === "manifest-json" && !contentType.toLowerCase().includes("application/manifest+json")) {
                  throw new Error(`Expected application/manifest+json, got ${contentType || "missing"}`);
                }
                if (route.type !== "json" && route.type !== "manifest-json" && !contentType.toLowerCase().includes(route.type)) {
                  throw new Error(`Expected ${route.type}, got ${contentType || "missing"}`);
                }
                if (!body.trim()) throw new Error("Empty response body");
                if (route.expectedText && !body.includes(route.expectedText)) {
                  throw new Error("Public page is missing expected account-deletion instructions");
                }
                if (route.type === "json") {
                  let payload;
                  try { payload = JSON.parse(body); } catch { throw new Error("Expected valid JSON response"); }
                  if (route.path === "/api/health") {
                    if (payload.success !== true || payload.status !== "ready" || payload.database !== "ok") {
                      throw new Error("Health endpoint did not confirm a ready API and healthy database");
                    }
                    // Public health is intentionally minimal and must not expose owner-only backup status.
                    if (Object.prototype.hasOwnProperty.call(payload, "backup")) {
                      throw new Error("Public health endpoint must not expose backup operational details");
                    }
                  }
                  if (route.path === "/api/health/ready") {
                    if (payload.success !== true || payload.status !== "ready" || payload.database !== true || payload.storage !== true) {
                      throw new Error("Readiness endpoint did not confirm database and storage readiness");
                    }
                  }
                  if (route.expectedStatus === 401 && payload.success === true) {
                    throw new Error("Protected endpoint reported success without authentication");
                  }
                  if (route.path === "/api/__smoke_unknown_route__" && payload.success !== false) {
                    throw new Error("Unknown API route must return a JSON failure response, not the SPA shell");
                  }
                  if (route.path.startsWith("/api/share/") && payload.success === true) {
                    throw new Error("An unknown share token must not return a successful payload");
                  }
                }
                console.log(`PASS ${route.path} -> ${response.status} (${contentType})`);
                lastError = null;
                break;
              } catch (error) {
                lastError = error;
                if (attempt < maxAttempts) {
                  const delayMs = route.path === "/api/health" ? 8000 : attempt * 1500;
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                }
              }
            }
            if (lastError) {
              failed = true;
              console.error(`FAIL ${route.path}: ${lastError.message}`);
            }
          }
          // The HTML app shell must never be stored by shared/browser caches.
          const shell = await fetch(new URL("/", base), { signal: AbortSignal.timeout(15000) });
          const shellCache = (shell.headers.get("cache-control") || "").toLowerCase();
          if (!shellCache.includes("no-store")) throw new Error("App shell is missing Cache-Control: no-store");

          // Vite emits content-hashed assets. Verify those can be cached immutably without
          // accidentally allowing un-fingerprinted or sensitive routes to be cached.
          const shellHtml = await shell.text();
          const assetPath = shellHtml.match(/(?:src|href)="([^"]*\/assets\/[^"]+\.(?:js|css))"/)?.[1];
          if (!assetPath) throw new Error("Could not locate a fingerprinted JavaScript/CSS asset in the production app shell");
          const assetUrl = new URL(assetPath, base);
          if (!/-[A-Za-z0-9_-]{8,}\.(?:js|css)$/.test(assetUrl.pathname)) {
            throw new Error("Production asset filename is not content-fingerprinted");
          }
          const assetResponse = await fetch(assetUrl, { signal: AbortSignal.timeout(15000) });
          const assetCache = (assetResponse.headers.get("cache-control") || "").toLowerCase();
          if (!assetResponse.ok || !assetCache.includes("public") || !assetCache.includes("immutable") || !assetCache.includes("max-age=31536000")) {
            throw new Error("Fingerprint asset must return public, immutable, one-year cache headers");
          }
          console.log("PASS cache policy: app shell is no-store and fingerprinted assets are immutable.");

          if (failed) process.exit(1);
          console.log("Production route, security-header, and unauthenticated-access smoke tests passed.");
          NODE

      - name: Verify account deletion rejects unauthenticated requests
        env:
          BASE_URL: https://secureid-production-b732.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.BASE_URL);
          const origin = base.origin;
          const init = await fetch(new URL("/api/auth/csrf", base), {
            headers: { Origin: origin, "User-Agent": "SecureID-account-deletion-smoke/1.0" },
            signal: AbortSignal.timeout(15000)
          });
          const initBody = await init.json().catch(() => ({}));
          if (init.status !== 200 || initBody.success !== true) {
            throw new Error("Could not initialize CSRF protection for the account-deletion guard test.");
          }
          const cookie = init.headers.getSetCookie().find(value => value.startsWith("__Host-secureid.csrf="));
          if (!cookie) throw new Error("CSRF bootstrap did not issue its secure cookie.");
          const cookiePair = cookie.split(";", 1)[0];
          const csrfToken = decodeURIComponent(cookiePair.slice(cookiePair.indexOf("=") + 1));
          const response = await fetch(new URL("/api/account", base), {
            method: "DELETE",
            headers: {
              Origin: origin,
              Cookie: cookiePair,
              "X-CSRF-Token": csrfToken,
              "Content-Type": "application/json",
              "User-Agent": "SecureID-account-deletion-smoke/1.0"
            },
            body: JSON.stringify({ password: "invalid-smoke-password" }),
            signal: AbortSignal.timeout(15000)
          });
          const payload = await response.json().catch(() => ({}));
          if (response.status !== 401 || payload.success !== false) {
            throw new Error("Unauthenticated account deletion must return HTTP 401 without mutating data; got HTTP " + response.status + ".");
          }
          console.log("PASS account deletion endpoint rejects unauthenticated requests after valid CSRF validation.");
          NODE

      - name: Verify public login endpoint accepts the production origin and CSRF protection
        env:
          BASE_URL: https://secureid-production-b732.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.BASE_URL);
          const origin = base.origin;
          const endpoint = new URL("/api/auth/login", base);
          const userAgent = "SecureID-production-auth-smoke/1.0";
          const csrfInit = await fetch(new URL("/api/auth/csrf", base), {
            headers: { "Origin": origin, "User-Agent": userAgent },
            signal: AbortSignal.timeout(15000)
          });
          const csrfContentType = csrfInit.headers.get("content-type") || "";
          const csrfInitBody = csrfContentType.includes("application/json")
            ? await csrfInit.json().catch(() => ({}))
            : {};
          // workflow_run smoke tests may execute before Railway deploys the just-tested commit.
          // If the previous live version serves the SPA fallback, defer the strict auth check;
          // rerun this job after deployment to verify the newly deployed endpoint.
          if (!csrfContentType.includes("application/json")) {
            console.warn("WARN CSRF bootstrap route is not live yet; rerun this smoke job after Railway deployment.");
            process.exit(0);
          }
          if (csrfInit.status !== 200 || csrfInitBody.success !== true) {
            throw new Error("CSRF bootstrap endpoint failed (HTTP " + csrfInit.status + ").");
          }
          const csrfCookie = csrfInit.headers.getSetCookie().find(value => value.startsWith("__Host-secureid.csrf="));
          if (!csrfCookie) throw new Error("CSRF bootstrap did not issue its secure token cookie.");
          const cookiePair = csrfCookie.split(";", 1)[0];
          const csrfToken = decodeURIComponent(cookiePair.slice(cookiePair.indexOf("=") + 1));
          const first = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Origin": origin,
              "Content-Type": "application/json",
              "Cookie": cookiePair,
              "User-Agent": userAgent
            },
            body: JSON.stringify({ email: "smoke-" + crypto.randomUUID() + "@example.invalid", password: "invalid-smoke-password" }),
            signal: AbortSignal.timeout(15000)
          });
          const firstBody = await first.json().catch(() => ({}));
          if (first.status !== 403 || firstBody.message !== "CSRF validation failed.") {
            throw new Error("Login endpoint did not reject a missing CSRF header (HTTP " + first.status + ", " + String(firstBody.message || "no message") + ").");
          }
          const second = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Origin": origin,
              "Content-Type": "application/json",
              "Cookie": cookiePair,
              "X-CSRF-Token": csrfToken,
              "User-Agent": userAgent
            },
            body: JSON.stringify({ email: "smoke-" + crypto.randomUUID() + "@example.invalid", password: "invalid-smoke-password" }),
            signal: AbortSignal.timeout(15000)
          });
          const secondBody = await second.json().catch(() => ({}));
          if (second.status !== 401 || secondBody.message !== "Email or password is incorrect.") {
            throw new Error("Login POST did not reach credential validation after valid origin/CSRF checks (HTTP " + second.status + ", " + String(secondBody.message || "no message") + ").");
          }
          console.log("PASS login endpoint: production origin accepted, CSRF enforced, invalid credentials rejected safely.");
          NODE
