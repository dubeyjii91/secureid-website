name: SecureID visual appearance smoke test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Render Play Store feature graphic at exact 1024x500
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          const svg = await readFile('public/play-store-feature-graphic.svg', 'utf8');
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1024, height: 500 }, deviceScaleFactor: 1 });
            await page.setContent(svg, { waitUntil: 'load' });
            const dimensions = await page.locator('svg').evaluate(element => {
              const box = element.getBoundingClientRect();
              return { width: box.width, height: box.height };
            });
            if (dimensions.width !== 1024 || dimensions.height !== 500) {
              throw new Error('Feature graphic must render at exactly 1024x500; got ' + JSON.stringify(dimensions));
            }
            const output = 'artifacts/secureid-play-store-feature-graphic.png';
            await page.screenshot({ path: output, fullPage: false, animations: 'disabled' });
            const png = await readFile(output);
            if (png.toString('hex', 0, 8) !== '89504e470d0a1a0a' || png.readUInt32BE(16) !== 1024 || png.readUInt32BE(20) !== 500) {
              throw new Error('Rendered feature graphic PNG has invalid dimensions or signature.');
            }
            console.log('PASS Play Store feature graphic PNG rendered at exactly 1024x500.');
          } finally {
            await browser.close();
          }
          NODE
      - name: Check desktop and mobile appearance and capture screenshots
        env:
          BASE_URL: https://secureid-production-b732.up.railway.app
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          let failures = [];
          try {
            for (const viewport of [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 },
            ]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
              page.on('pageerror', error => failures.push(`${viewport.name}: browser JS error: ${error.message}`));
              let response;
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  response = await page.goto(base, { waitUntil: 'networkidle', timeout: 30000 });
                  if (response?.ok()) break;
                } catch (error) {
                  if (attempt === 5) throw error;
                  await page.waitForTimeout(2000);
                }
              }
              if (!response?.ok()) throw new Error(`${viewport.name}: homepage returned HTTP ${response?.status()}`);
              let themeReady = false;
              for (let attempt = 1; attempt <= 12; attempt++) {
                await page.waitForTimeout(1500);
                const theme = await page.evaluate(() => {
                  const overlay = document.querySelector('.welcomeSplash') || document.querySelector('.authShell') || document.body;
                  const card = document.querySelector('.welcomeCard') || document.querySelector('button.primary');
                  const button = document.querySelector('button.primary') || document.querySelector('button');
                  return {
                    overlayBackground: getComputedStyle(overlay).backgroundColor,
                    cardBackgroundImage: card ? getComputedStyle(card).backgroundImage : 'none',
                    buttonBackground: button ? getComputedStyle(button).backgroundColor : 'rgb(255, 255, 255)',
                    buttonText: button ? getComputedStyle(button).color : 'rgb(0, 0, 0)'
                  };
                });
                console.log(`THEME PREFLIGHT ${viewport.name.toUpperCase()} attempt ${attempt}: ${JSON.stringify(theme)}`);
                if (theme.overlayBackground === 'rgba(23, 37, 84, 0.52)'
                  && theme.buttonText === 'rgb(255, 255, 255)') {
                  themeReady = true;
                  break;
                }
                if (attempt < 12) {
                  await page.waitForTimeout(4000);
                  await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
                }
              }
              if (!themeReady) failures.push(`${viewport.name}: SecureID warm ivory / teal theme was not live after deployment wait`);
              await page.waitForTimeout(1000);
              await page.screenshot({ path: `artifacts/secureid-${viewport.name}.png`, fullPage: true, animations: 'disabled' });

              const result = await page.evaluate(() => {
                const visible = element => {
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0;
                };
                const isMedia = element => /^(IMG|VIDEO|CANVAS|IFRAME|SVG|PATH|PICTURE|SOURCE)$/i.test(element.tagName);
                const rgb = value => value.replace(/\\s/g, '');
                const backgrounds = [];
                const textColors = [];
                for (const element of document.querySelectorAll('body, body *')) {
                  if (!visible(element) || isMedia(element)) continue;
                  const style = getComputedStyle(element);
                  const bg = style.backgroundColor;
                  const alphaText = bg.startsWith('rgba(') ? bg.slice(bg.lastIndexOf(',') + 1, -1).trim() : null;
                  const transparent = bg === 'transparent' || (alphaText !== null && Number(alphaText) === 0);
                  if (!transparent && bg !== 'rgb(255, 255, 255)') {
                    backgrounds.push({ tag: element.tagName, className: String(element.className?.baseVal ?? element.className ?? '').slice(0, 100), background: bg });
                  }
                  if (style.backgroundImage !== 'none') {
                    backgrounds.push({ tag: element.tagName, className: String(element.className?.baseVal ?? element.className ?? '').slice(0, 100), backgroundImage: style.backgroundImage.slice(0, 120) });
                  }
                  const hasText = element.children.length === 0 && (element.textContent || '').trim().length > 0;
                  if (hasText) {
                    const color = style.color;
                    const isLink = element.closest('a');
                    const allowed = color === 'rgb(0, 0, 0)' || (isLink && color === 'rgb(0, 51, 160)');
                    if (!allowed) textColors.push({ tag: element.tagName, text: element.textContent.trim().slice(0, 60), color });
                  }
                }
                return {
                  title: document.title,
                  rootBackground: getComputedStyle(document.documentElement).backgroundColor,
                  bodyBackground: getComputedStyle(document.body).backgroundColor,
                  backgroundIssues: backgrounds.slice(0, 40),
                  backgroundIssueCount: backgrounds.length,
                  textColorIssues: textColors.slice(0, 40),
                  textColorIssueCount: textColors.length,
                  headingColor: getComputedStyle(document.querySelector('.authShell h1') || document.querySelector('h1')).color,
                  bodyTextColor: getComputedStyle(document.querySelector('.authShell p') || document.querySelector('p')).color,
                  primaryButtonTextColor: getComputedStyle(document.querySelector('.authShell button.primary') || document.querySelector('button.primary')).color,
                  primaryButtonBackgroundImage: getComputedStyle(document.querySelector('.authShell button.primary') || document.querySelector('button.primary')).backgroundImage,
                  horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth,
                };
              });

              console.log(`VISUAL ${viewport.name.toUpperCase()} ${JSON.stringify(result)}`);
              if (result.rootBackground !== 'rgb(255, 248, 237)') {
                failures.push(`${viewport.name}: warm ivory page background is missing`);
              }
              if (result.headingColor !== 'rgb(23, 37, 84)' || result.bodyTextColor !== 'rgb(54, 81, 107)') {
                failures.push(`${viewport.name}: primary text colors do not match the readable navy/blue palette`);
              }
              if (result.primaryButtonTextColor !== 'rgb(255, 255, 255)' || !result.primaryButtonBackgroundImage.includes('linear-gradient')) {
                failures.push(`${viewport.name}: primary action button lost its high-contrast teal gradient treatment`);
              }
              if (result.horizontalOverflow) failures.push(`${viewport.name}: horizontal overflow detected`);
              await page.close();
            }
          } finally {
            await browser.close();
          }
          for (const path of ['/secureid-welcome.svg', '/secureid-app-icon.svg']) {
            const response = await fetch(new URL(path, base), { signal: AbortSignal.timeout(15000) });
            const source = await response.text();
            if (!response.ok || !source.includes('fill="#ffffff"') || !source.includes('fill="#000000"')) {
              failures.push(`${path}: SVG background/text colors are not white/black as requested`);
            } else {
              console.log(`PASS ${path}: white background and black lettering`);
            }
          }
          if (failures.length) {
            console.error('VISUAL CHECK FAILURES\\n' + failures.join('\\n'));
            process.exit(1);
          }
          console.log('PASS: desktop and mobile warm ivory theme, readable navy/blue text, high-contrast teal actions, and no horizontal overflow.');
          NODE
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureid-visual-screenshots
          path: |
            artifacts/secureid-desktop.png
            artifacts/secureid-mobile.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Play Store feature graphic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureid-play-store-feature-graphic
          path: artifacts/secureid-play-store-feature-graphic.png
          if-no-files-found: error
          retention-days: 14
