name: SecureID visual appearance smoke test

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "public/**"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application and browser-test dependencies
        run: |
          npm ci --no-audit --no-fund
          mkdir -p /tmp/secureid-browser-deps
          npm install --prefix /tmp/secureid-browser-deps --no-audit --no-fund playwright
          ln -s /tmp/secureid-browser-deps/node_modules/playwright node_modules/playwright
          /tmp/secureid-browser-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Build the exact pull-request frontend
        run: npm run build
      - name: Start isolated production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/secureid-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/secureid-preview.log
          exit 1
      - name: Check authenticated dashboard, icons, navigation and responsive layouts
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const apiPayload = (url, role) => {
            const path = new URL(url).pathname;
            if (path === '/api/auth/session') return { user: { email: role + '@secureid.test', role, mfaVerified: true }, wallet: { risk: 12, locked: false, shareData: {} } };
            if (path === '/api/security/dashboard') return { score: 92, scoreLabel: 'Strong', stats: { activeSessions: 1, activeShares: 0, documents: 2, recoveryCodesRemaining: 8 } };
            if (path === '/api/privacy') return { settings: { security_alerts: 1, login_notifications: 1, share_notifications: 1, analytics: 0 } };
            if (path === '/api/admin/health' || path === '/api/health') return { status: 'ready', database: 'ok', emailDelivery: { configured: true, provider: 'test', testSender: false }, backup: { enabled: true, lastSuccessAt: '2026-11-13T00:00:00.000Z' } };
            return {};
          };

          async function openDashboard(viewport, role) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            page.on('pageerror', error => failures.push(role + ' ' + viewport.width + 'px: ' + error.message));
            await page.route('**/api/**', async route => {
              const payload = apiPayload(route.request().url(), role);
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(payload), headers: { 'cache-control': 'no-store' } });
            });
            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
            if (!response?.ok()) throw new Error('Local preview did not return HTTP 200.');
            await page.locator('.quickAccessGrid').waitFor({ state: 'visible', timeout: 20000 });
            const welcome = page.getByRole('button', { name: 'Continue securely' });
            if (await welcome.isVisible().catch(() => false)) await welcome.click();
            await page.locator('.quickAccessGrid').waitFor({ state: 'visible' });
            return page;
          }

          try {
            for (const viewport of [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 }
            ]) {
              const page = await openDashboard(viewport, 'owner');
              const checks = await page.evaluate(() => ({
                title: document.title,
                navCount: document.querySelectorAll('.sidebar .navItem').length,
                navSvgCount: document.querySelectorAll('.sidebar .navItem .navIcon svg').length,
                launcherCount: document.querySelectorAll('.quickAccessCard').length,
                launcherSvgCount: document.querySelectorAll('.quickAccessCard .quickAccessIcon svg').length,
                rootWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
                background: getComputedStyle(document.body).backgroundImage,
                bodyColor: getComputedStyle(document.body).color,
                rootColor: getComputedStyle(document.documentElement).backgroundColor,
                cardBackground: getComputedStyle(document.querySelector('.quickAccessCard')).backgroundImage,
                cardColor: getComputedStyle(document.querySelector('.quickAccessCard')).backgroundColor,
                primaryText: getComputedStyle(document.querySelector('.quickAccessCard strong')).color,
                navText: getComputedStyle(document.querySelector('.sidebar .navItem:not(.active)')).color,
                navFill: getComputedStyle(document.querySelector('.sidebar .navItem:not(.active)')).webkitTextFillColor,
                activeNavText: getComputedStyle(document.querySelector('.sidebar .navItem.active')).color,
                                metricText: getComputedStyle(document.querySelector('.securityStats b')).color,
                healthText: getComputedStyle(document.querySelector('.systemHealthGrid strong')).color,
                workspaceIconColor: getComputedStyle(document.querySelector('.quickAccessCard .quickAccessIcon')).color,
                workspaceIconBackground: getComputedStyle(document.querySelector('.quickAccessCard .quickAccessIcon')).backgroundColor,
                mobileNavOverflow: getComputedStyle(document.querySelector('.sidebar nav')).overflowX
              }));
              console.log('VISUAL ' + viewport.name.toUpperCase() + ' ' + JSON.stringify(checks));
              if (checks.navCount < 10 || checks.navSvgCount !== checks.navCount) failures.push(viewport.name + ': sidebar navigation icons are missing.');
              if (checks.launcherCount !== 11 || checks.launcherSvgCount !== 11) failures.push(viewport.name + ': expected 11 owner workspace cards with SVG icons.');
              if (checks.rootWidth > checks.viewportWidth) failures.push(viewport.name + ': horizontal page overflow detected.');
              if (checks.rootColor !== 'rgb(247, 248, 250)' || checks.bodyColor !== 'rgb(23, 25, 28)') failures.push(viewport.name + ': neutral premium canvas or graphite body text is missing.');
              if (checks.cardColor !== 'rgb(255, 255, 255)' && !checks.cardBackground.includes('rgb(255, 255, 255)')) failures.push(viewport.name + ': dashboard launcher cards should use clean white surfaces.');
              if (checks.primaryText !== 'rgb(23, 25, 28)' || checks.navText !== 'rgb(71, 77, 87)' || checks.navFill !== 'rgb(71, 77, 87)' || checks.activeNavText !== 'rgb(81, 69, 216)' || checks.metricText !== 'rgb(23, 25, 28)' || checks.healthText !== 'rgb(22, 128, 90)' || checks.workspaceIconColor !== 'rgb(101, 88, 245)' || checks.workspaceIconBackground !== 'rgb(241, 239, 255)') failures.push(viewport.name + ': graphite text, neutral navigation, violet workspace icons or semantic health colour is incorrect.');
              if (viewport.name === 'mobile' && checks.mobileNavOverflow !== 'auto') failures.push('mobile: navigation must remain horizontally scrollable without clipping menu items.');
              await page.screenshot({ path: 'artifacts/secureid-' + viewport.name + '.png', fullPage: true, animations: 'disabled' });

              if (viewport.name === 'desktop') {
                await page.getByRole('button', { name: /Document vault/ }).last().click();
                await page.getByRole('heading', { name: 'Documents & Identity' }).waitFor({ state: 'visible', timeout: 10000 });
                const active = await page.locator('.sidebar .navItem.active').innerText();
                if (!/Document vault/i.test(active)) failures.push('Dashboard Document Vault shortcut did not activate its matching navigation item.');
              }
              await page.close();
            }

            const studentPage = await openDashboard({ width: 1280, height: 900 }, 'user');
            const studentCards = await studentPage.locator('.quickAccessCard').allInnerTexts();
            if (studentCards.length !== 9) failures.push('Normal user should see 9 standard workspaces, not owner-only shortcuts.');
            if (studentCards.some(text => /Owner \/ Admin|All user documents/i.test(text))) failures.push('Owner-only workspace leaked into the normal-user dashboard.');
            await studentPage.screenshot({ path: 'artifacts/secureid-user-dashboard.png', fullPage: true, animations: 'disabled' });

            await studentPage.getByRole('button', { name: /Scholarship finder/i }).click();
            await studentPage.locator('.scholarshipPortalGrid').waitFor({ state: 'visible', timeout: 10000 });
            if (await studentPage.locator('.scholarshipPrimaryLink').count() !== 3) failures.push('Scholarship Finder must expose Bihar PMS, Jharkhand e-Kalyan and NSP official links.');
            await studentPage.locator('.scholarshipFilterGrid select').first().selectOption('Bihar');
            const biharTitles = await studentPage.locator('.scholarshipPortalCard h3').allTextContents();
            if (biharTitles.length !== 2 || !biharTitles.some(title => /Bihar Post-Matric/i.test(title)) || !biharTitles.some(title => /National Scholarship Portal/i.test(title))) failures.push('Domicile filtering should show Bihar PMS and national schemes for Bihar students.');
            await studentPage.screenshot({ path: 'artifacts/secureid-scholarships.png', fullPage: true, animations: 'disabled' });
            await studentPage.getByRole('button', { name: 'Open Document Vault' }).click();
            await studentPage.getByRole('heading', { name: 'Documents & Identity' }).waitFor({ state: 'visible', timeout: 10000 });
            const scholarshipHandoff = await studentPage.locator('.sidebar .navItem.active').innerText();
            if (!/Document vault/i.test(scholarshipHandoff)) failures.push('Scholarship checklist did not navigate to the Document Vault.');
            const vaultLayout = await studentPage.evaluate(() => ({
              pageWidth: document.documentElement.scrollWidth,
              viewportWidth: window.innerWidth,
              formInputHeight: document.querySelector('.documentVault .identityForm input')?.getBoundingClientRect().height || 0,
              documentCardCount: document.querySelectorAll('.documentVault .documentItem').length
            }));
            if (vaultLayout.pageWidth > vaultLayout.viewportWidth) failures.push('Document Vault has horizontal overflow on desktop.');
            if (vaultLayout.formInputHeight && vaultLayout.formInputHeight < 44) failures.push('Document Vault form controls are too short to use comfortably.');
            await studentPage.screenshot({ path: 'artifacts/secureid-document-vault.png', fullPage: true, animations: 'disabled' });

            await studentPage.getByRole('button', { name: /My identity/i }).click();
            await studentPage.locator('.identityProfileFields').waitFor({ state: 'visible', timeout: 10000 });
            const identityLayout = await studentPage.evaluate(() => ({
              pageWidth: document.documentElement.scrollWidth,
              viewportWidth: window.innerWidth,
              fieldCount: document.querySelectorAll('.identityProfileFields input').length,
              minInputHeight: Math.min(...Array.from(document.querySelectorAll('.identityProfileFields input'), input => input.getBoundingClientRect().height)),
              labelFontSize: parseFloat(getComputedStyle(document.querySelector('.identityProfileFields label')).fontSize),
              detailsGridColumns: getComputedStyle(document.querySelector('.profileGrid .details')).gridTemplateColumns
            }));
            if (identityLayout.pageWidth > identityLayout.viewportWidth) failures.push('My Identity has horizontal overflow on desktop.');
            if (identityLayout.fieldCount !== 10 || identityLayout.minInputHeight < 44 || identityLayout.labelFontSize < 13) failures.push('My Identity labels or input fields are too small or missing.');
            await studentPage.screenshot({ path: 'artifacts/secureid-identity.png', fullPage: true, animations: 'disabled' });

            await studentPage.getByRole('button', { name: /Share ID/i }).click();
            await studentPage.locator('.claimGrid').waitFor({ state: 'visible', timeout: 10000 });
            const shareLayout = await studentPage.evaluate(() => {
              const checkbox = document.querySelector('.claimGrid input[type="checkbox"]');
              return {
                pageWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
                claimCount: document.querySelectorAll('.claimGrid .claim').length,
                checkboxWidth: checkbox?.getBoundingClientRect().width || 0,
                checkboxHeight: checkbox?.getBoundingClientRect().height || 0,
                claimFontSize: parseFloat(getComputedStyle(document.querySelector('.claim span')).fontSize)
              };
            });
            if (shareLayout.pageWidth > shareLayout.viewportWidth) failures.push('Share ID has horizontal overflow on desktop.');
            if (shareLayout.claimCount !== 11 || shareLayout.checkboxWidth < 17 || shareLayout.checkboxHeight < 17 || shareLayout.claimFontSize < 13) failures.push('Share ID claim checkboxes or labels have unusable sizing.');
            await studentPage.screenshot({ path: 'artifacts/secureid-share-id.png', fullPage: true, animations: 'disabled' });

            for (const pageName of [
              'Safety check',
              'Emergency lock/unlock',
              'Security activity',
              'Active sessions',
              'Share management',
              'Parent Portal',
              'Account security',
              'Privacy & Terms'
            ]) {
              const navigationButton = studentPage.locator('.sidebar .navItem').filter({ hasText: pageName }).last();
              await navigationButton.click();
              await studentPage.locator('.topbar h1').waitFor({ state: 'visible', timeout: 10000 });
              const heading = (await studentPage.locator('.topbar h1').innerText()).trim();
              if (heading !== pageName) failures.push(pageName + ': navigation did not open the expected page heading (got "' + heading + '").');
              const pageBounds = await studentPage.evaluate(() => ({ page: document.documentElement.scrollWidth, viewport: window.innerWidth }));
              if (pageBounds.page > pageBounds.viewport) failures.push(pageName + ': desktop page has horizontal overflow.');
            }

            await studentPage.close();

            const mobileScholarshipPage = await openDashboard({ width: 390, height: 844 }, 'user');
            await mobileScholarshipPage.getByRole('button', { name: /Scholarship finder/i }).click();
            await mobileScholarshipPage.locator('.scholarshipPortalGrid').waitFor({ state: 'visible', timeout: 10000 });
            const scholarshipMobileWidth = await mobileScholarshipPage.evaluate(() => ({ page: document.documentElement.scrollWidth, viewport: window.innerWidth }));
            if (scholarshipMobileWidth.page > scholarshipMobileWidth.viewport) failures.push('Scholarship Finder causes horizontal overflow on a mobile viewport.');
            await mobileScholarshipPage.screenshot({ path: 'artifacts/secureid-scholarships-mobile.png', fullPage: true, animations: 'disabled' });

            await mobileScholarshipPage.getByRole('button', { name: /My identity/i }).click();
            await mobileScholarshipPage.locator('.identityProfileFields').waitFor({ state: 'visible', timeout: 10000 });
            const identityMobileWidth = await mobileScholarshipPage.evaluate(() => ({ page: document.documentElement.scrollWidth, viewport: window.innerWidth }));
            if (identityMobileWidth.page > identityMobileWidth.viewport) failures.push('My Identity has horizontal overflow on a mobile viewport.');
            await mobileScholarshipPage.getByRole('button', { name: /Share ID/i }).click();
            await mobileScholarshipPage.locator('.claimGrid').waitFor({ state: 'visible', timeout: 10000 });
            const shareMobileWidth = await mobileScholarshipPage.evaluate(() => ({ page: document.documentElement.scrollWidth, viewport: window.innerWidth }));
            if (shareMobileWidth.page > shareMobileWidth.viewport) failures.push('Share ID has horizontal overflow on a mobile viewport.');

            for (const pageName of [
              'Safety check',
              'Emergency lock/unlock',
              'Security activity',
              'Active sessions',
              'Share management',
              'Parent Portal',
              'Account security',
              'Privacy & Terms'
            ]) {
              const navigationButton = mobileScholarshipPage.locator('.sidebar .navItem').filter({ hasText: pageName }).last();
              await navigationButton.click();
              const heading = (await mobileScholarshipPage.locator('.topbar h1').innerText()).trim();
              if (heading !== pageName) failures.push(pageName + ': mobile navigation did not open the expected page.');
              const pageBounds = await mobileScholarshipPage.evaluate(() => ({ page: document.documentElement.scrollWidth, viewport: window.innerWidth }));
              if (pageBounds.page > pageBounds.viewport) failures.push(pageName + ': mobile page has horizontal overflow.');
            }
            await mobileScholarshipPage.close();
          } finally {
            await browser.close();
          }

          if (failures.length) {
            console.error('VISUAL CHECK FAILURES\\n' + failures.join('\\n'));
            process.exit(1);
          }
          console.log('PASS: PR build renders; premium light theme contrast is verified; desktop/mobile navigation has SVG icons; owner dashboard has 11 workspace cards; normal user sees only 9; Document Vault shortcut navigates; no horizontal overflow.');
          NODE
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureid-redesign-visual-screenshots
          path: artifacts/secureid-*.png
          if-no-files-found: warn
          retention-days: 7
