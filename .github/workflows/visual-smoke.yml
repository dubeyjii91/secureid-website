name: SecureID visual appearance smoke test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application and browser-test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Build the exact pull-request frontend
        run: npm run build
      - name: Start isolated production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/secureid-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/secureid-preview.log
          exit 1
      - name: Check authenticated dashboard, icons, navigation and responsive layouts
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const apiPayload = (url, role) => {
            const path = new URL(url).pathname;
            if (path === '/api/auth/session') return { user: { email: role + '@secureid.test', role, mfaVerified: true }, wallet: { risk: 12, locked: false, shareData: {} } };
            if (path === '/api/security/dashboard') return { score: 92, scoreLabel: 'Strong', stats: { activeSessions: 1, activeShares: 0, documents: 2, recoveryCodesRemaining: 8 } };
            if (path === '/api/privacy') return { settings: { security_alerts: 1, login_notifications: 1, share_notifications: 1, analytics: 0 } };
            if (path === '/api/admin/health' || path === '/api/health') return { status: 'ready', database: 'ok', emailDelivery: { configured: true, provider: 'test', testSender: false }, backup: { enabled: true, lastSuccessAt: '2026-11-13T00:00:00.000Z' } };
            return {};
          };

          async function openDashboard(viewport, role) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            page.on('pageerror', error => failures.push(role + ' ' + viewport.width + 'px: ' + error.message));
            await page.route('**/api/**', async route => {
              const payload = apiPayload(route.request().url(), role);
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(payload), headers: { 'cache-control': 'no-store' } });
            });
            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
            if (!response?.ok()) throw new Error('Local preview did not return HTTP 200.');
            await page.locator('.quickAccessGrid').waitFor({ state: 'visible', timeout: 20000 });
            const welcome = page.getByRole('button', { name: 'Continue securely' });
            if (await welcome.isVisible().catch(() => false)) await welcome.click();
            await page.locator('.quickAccessGrid').waitFor({ state: 'visible' });
            return page;
          }

          try {
            for (const viewport of [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 }
            ]) {
              const page = await openDashboard(viewport, 'owner');
              const checks = await page.evaluate(() => ({
                title: document.title,
                navCount: document.querySelectorAll('.sidebar .navItem').length,
                navSvgCount: document.querySelectorAll('.sidebar .navItem .navIcon svg').length,
                launcherCount: document.querySelectorAll('.quickAccessCard').length,
                launcherSvgCount: document.querySelectorAll('.quickAccessCard .quickAccessIcon svg').length,
                rootWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
                background: getComputedStyle(document.body).backgroundImage,
                rootColor: getComputedStyle(document.documentElement).backgroundColor,
                cardBackground: getComputedStyle(document.querySelector('.quickAccessCard')).backgroundImage,
                primaryText: getComputedStyle(document.querySelector('.quickAccessCard strong')).color,
                navText: getComputedStyle(document.querySelector('.sidebar .navItem')).color,
                navFill: getComputedStyle(document.querySelector('.sidebar .navItem')).webkitTextFillColor,
                metricText: getComputedStyle(document.querySelector('.securityStats b')).color,
                healthText: getComputedStyle(document.querySelector('.systemHealthGrid strong')).color
              }));
              console.log('VISUAL ' + viewport.name.toUpperCase() + ' ' + JSON.stringify(checks));
              if (checks.navCount < 10 || checks.navSvgCount !== checks.navCount) failures.push(viewport.name + ': sidebar navigation icons are missing.');
              if (checks.launcherCount !== 11 || checks.launcherSvgCount !== 11) failures.push(viewport.name + ': expected 11 owner workspace cards with SVG icons.');
              if (checks.rootWidth > checks.viewportWidth) failures.push(viewport.name + ': horizontal page overflow detected.');
              if (!checks.background.includes('radial-gradient') || checks.rootColor !== 'rgb(7, 17, 31)') failures.push(viewport.name + ': SecureID dark navy/cyan page background is missing.');
              if (!checks.cardBackground.includes('linear-gradient')) failures.push(viewport.name + ': dashboard launcher cards lost their branded surface treatment.');
              if (checks.primaryText !== 'rgb(240, 247, 255)' || checks.navText === 'rgb(0, 0, 0)' || checks.navFill === 'rgb(33, 56, 93)' || checks.metricText !== 'rgb(242, 247, 255)' || !['rgb(237, 245, 255)','rgb(121, 228, 180)'].includes(checks.healthText)) failures.push(viewport.name + ': dashboard or navigation text contrast is not using the accessible light palette.');
              await page.screenshot({ path: 'artifacts/secureid-' + viewport.name + '.png', fullPage: true, animations: 'disabled' });

              if (viewport.name === 'desktop') {
                await page.getByRole('button', { name: /Document vault/ }).last().click();
                await page.getByRole('heading', { name: 'Documents & Identity' }).waitFor({ state: 'visible', timeout: 10000 });
                const active = await page.locator('.sidebar .navItem.active').innerText();
                if (!/Document vault/i.test(active)) failures.push('Dashboard Document Vault shortcut did not activate its matching navigation item.');
              }
              await page.close();
            }

            const studentPage = await openDashboard({ width: 1280, height: 900 }, 'user');
            const studentCards = await studentPage.locator('.quickAccessCard').allInnerTexts();
            if (studentCards.length !== 9) failures.push('Normal user should see 10 standard workspaces, not owner-only shortcuts.');
            if (studentCards.some(text => /Owner \/ Admin|All user documents/i.test(text))) failures.push('Owner-only workspace leaked into the normal-user dashboard.');
            await studentPage.screenshot({ path: 'artifacts/secureid-user-dashboard.png', fullPage: true, animations: 'disabled' });
            await studentPage.close();
          } finally {
            await browser.close();
          }

          if (failures.length) {
            console.error('VISUAL CHECK FAILURES\\n' + failures.join('\\n'));
            process.exit(1);
          }
          console.log('PASS: PR build renders; desktop/mobile navigation has SVG icons; owner dashboard has 12 working workspace cards; normal user sees only 9; Document Vault shortcut navigates; no horizontal overflow.');
          NODE
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureid-redesign-visual-screenshots
          path: artifacts/secureid-*.png
          if-no-files-found: warn
          retention-days: 7
