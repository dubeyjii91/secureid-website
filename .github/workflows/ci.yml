name: SecureID CI

on:
  pull_request:
  push:
    branches: [main, 'security/**']

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=low
      - name: Scan repository for vulnerable dependencies and filesystem issues
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build production frontend
        run: npm run build
      - name: Lint source
        run: npm run lint
      - name: Run security unit tests
        run: npm test
      - name: Run native Android app TypeScript checks
        run: npm install --prefix mobile --no-audit --no-fund && npm --prefix mobile run typecheck
      - name: Smoke test deployed native authentication bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_BASE_URL: https://secureid-production-b732.up.railway.app
        run: |
          ready=0
          for attempt in $(seq 1 18); do
            if curl -fsS "$API_BASE_URL/api/health/ready" >/dev/null; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          csrf_payload="$(curl -fsS -H 'X-SecureID-Client: native' "$API_BASE_URL/api/auth/csrf")"
          node -e 'const p=JSON.parse(process.argv[1]); if(typeof p.csrfToken !== "string" || !/^[A-Za-z0-9_-]{32,}$/.test(p.csrfToken)) process.exit(1);' "$csrf_payload"
          login_status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'X-SecureID-Client: native' -H 'Content-Type: application/json' -d '{}' "$API_BASE_URL/api/auth/login")"
          test "$login_status" = "403"
      - name: Start Android preview APK build with EAS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not configured; skipping the EAS APK build."
            exit 0
          fi
          npx --yes eas-cli build --platform android --profile preview --non-interactive --no-wait
      - name: Test encrypted backup and restore in isolated temporary storage
        run: node scripts/backup-restore-smoke.mjs

  codeql:
    name: CodeQL static security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v3
