name: SecureID scheduled encrypted backup

on:
  # GitHub-hosted scheduling runs outside the SecureID API process, so a sleeping
  # Railway service does not stop the schedule itself. This stores the encrypted
  # artifact on the existing Railway volume; it is NOT an off-site backup.
  schedule:
    - cron: "35 3 * * *" # 09:05 Asia/Kolkata (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secureid-scheduled-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger encrypted backup on SecureID
        env:
          BACKUP_TRIGGER_TOKEN: ${{ secrets.SECUREID_BACKUP_TRIGGER_TOKEN }}
          BACKUP_TRIGGER_URL: https://secureid-production-b732.up.railway.app/api/internal/backup/run
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_TRIGGER_TOKEN:-}" ]; then
            echo "::error::SECUREID_BACKUP_TRIGGER_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 8); do
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --connect-timeout 15 --max-time 120 \
              --request POST \
              --header "Authorization: Bearer $BACKUP_TRIGGER_TOKEN" \
              "$BACKUP_TRIGGER_URL" || true)"

            if [ "$status" = "200" ]; then
              node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(p.success!==true || !/^[a-f0-9]{64}$/i.test(p.sha256||"")) process.exit(1); console.log("Encrypted backup completed; SHA-256: "+p.sha256+"; at: "+p.completedAt);' "$response_file"
              exit 0
            fi
            if [ "$status" = "401" ] || [ "$status" = "404" ]; then
              echo "::error::Backup trigger authorization/configuration failed (HTTP $status). Check the two secret values without printing them."
              exit 1
            fi
            echo "Backup endpoint not ready (attempt $attempt/8, HTTP ${status:-no response}); retrying."
            sleep 20
          done
          echo "::error::SecureID did not confirm an encrypted backup after 8 attempts."
          exit 1
