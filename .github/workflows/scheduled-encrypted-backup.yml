name: SecureID scheduled encrypted backup

on:
  # GitHub-hosted scheduling runs independently of the Railway API process.
  schedule:
    - cron: "35 3 * * *" # 09:05 Asia/Kolkata (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secureid-scheduled-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Create encrypted backup on SecureID
        env:
          BACKUP_TRIGGER_TOKEN: ${{ secrets.SECUREID_BACKUP_TRIGGER_TOKEN }}
          BACKUP_TRIGGER_URL: https://secureid-production-b732.up.railway.app/api/internal/backup/run
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_TRIGGER_TOKEN:-}" ]; then
            echo "::error::SECUREID_BACKUP_TRIGGER_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 8); do
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --connect-timeout 15 --max-time 120 \
              --request POST \
              --header "Authorization: Bearer $BACKUP_TRIGGER_TOKEN" \
              "$BACKUP_TRIGGER_URL" || true)"
            if [ "$status" = "200" ]; then
              node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(p.success!==true || !/^[a-f0-9]{64}$/i.test(p.sha256||"")) process.exit(1); console.log("Encrypted backup created; digest: "+p.sha256+"; at: "+p.completedAt);' "$response_file"
              break
            fi
            if [ "$status" = "401" ] || [ "$status" = "404" ]; then
              echo "::error::Backup trigger authorization/configuration failed (HTTP $status). Check the two secret values without printing them."
              exit 1
            fi
            if [ "$attempt" = "8" ]; then
              echo "::error::SecureID did not confirm an encrypted backup after 8 attempts."
              exit 1
            fi
            echo "Backup endpoint not ready (attempt $attempt/8, HTTP ${status:-no response}); retrying."
            sleep 20
          done

      - name: Require a private repository before handling backup data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")"
          is_private="$(printf '%s' "$metadata" | jq -r '.private // false')"
          if [ "$is_private" != "true" ]; then
            echo "::error::SecureID backup export is blocked: the destination GitHub repository is public. Move this workflow to a private repository before enabling off-site backup."
            exit 1
          fi
          echo "Private backup destination verified."

      - name: Download encrypted backup from Railway
        env:
          BACKUP_TRIGGER_TOKEN: ${{ secrets.SECUREID_BACKUP_TRIGGER_TOKEN }}
          BACKUP_DOWNLOAD_URL: https://secureid-production-b732.up.railway.app/api/internal/backup/download
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/secureid-backup-headers.txt"
          body="$RUNNER_TEMP/secureid-backup.json"
          status=""
          for attempt in $(seq 1 4); do
            status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              --connect-timeout 15 --max-time 600 \
              --header "Authorization: Bearer $BACKUP_TRIGGER_TOKEN" \
              "$BACKUP_DOWNLOAD_URL" || true)"
            [ "$status" = "200" ] && break
            if [ "$status" = "401" ] || [ "$status" = "404" ] || [ "$status" = "413" ]; then
              echo "::error::Encrypted backup export rejected (HTTP $status); no artifact was uploaded."
              exit 1
            fi
            if [ "$attempt" = "4" ]; then
              echo "::error::Could not download encrypted backup after 4 attempts (HTTP ${status:-no response})."
              exit 1
            fi
            sleep 15
          done

          size="$(wc -c < "$body" | tr -d ' ')"
          if [ "$size" -lt 1 ] || [ "$size" -gt 419430400 ]; then
            echo "::error::Encrypted backup exceeds the 400 MiB off-site transfer safety limit."
            exit 1
          fi
          expected="$(awk 'BEGIN{IGNORECASE=1} /^X-Backup-SHA256:/ {gsub("\\r",""); print $2}' "$headers" | tail -n 1)"
          created="$(awk 'BEGIN{IGNORECASE=1} /^X-Backup-Created-At:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub("\\r",""); print}' "$headers" | tail -n 1)"
          filename="$(awk 'BEGIN{IGNORECASE=1} /^Content-Disposition:/ {gsub("\\r",""); if (match($0,/filename="[^"]+"/)) print substr($0,RSTART+10,RLENGTH-11)}' "$headers" | tail -n 1)"
          if ! [[ "$expected" =~ ^[a-fA-F0-9]{64}$ ]] || ! [[ "$filename" =~ ^secureid-[A-Za-z0-9T._-]+\.backup\.json$ ]]; then
            echo "::error::Backup response headers failed validation."
            exit 1
          fi
          actual="$(sha256sum "$body" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Downloaded encrypted backup SHA-256 does not match the server digest."
            exit 1
          fi
          mv "$body" "$RUNNER_TEMP/$filename"
          cat > "$RUNNER_TEMP/secureid-backup-manifest.txt" <<EOF
          filename=$filename
          sha256=$actual
          created_at=$created
          bytes=$size
          encryption=AES-256-GCM
          key_location=Railway BACKUP_ENCRYPTION_KEY (not included)
          EOF
          echo "Verified encrypted backup: $filename ($size bytes); SHA-256 $actual."
          {
            echo "### SecureID encrypted off-site backup"
            echo "- Backup created: $created"
            echo "- File size: $size bytes"
            echo "- SHA-256: $actual"
            echo "- Retention: 30 days (GitHub Actions artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store verified encrypted backup off-site
        uses: actions/upload-artifact@v4
        with:
          name: secureid-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/secureid-*.backup.json
            ${{ runner.temp }}/secureid-backup-manifest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
