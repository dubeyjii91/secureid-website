name: SecureID scheduled encrypted backup

on:
  schedule:
    - cron: "35 3 * * *" # 09:05 Asia/Kolkata (UTC)
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: secureid-scheduled-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger encrypted backup on SecureID
        id: backup
        env:
          BACKUP_TRIGGER_TOKEN: ${{ secrets.SECUREID_BACKUP_TRIGGER_TOKEN }}
          BACKUP_TRIGGER_URL: https://secureid-production-b732.up.railway.app/api/internal/backup/run
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_TRIGGER_TOKEN:-}" ]; then
            echo "::error::SECUREID_BACKUP_TRIGGER_TOKEN is not configured."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 8); do
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --connect-timeout 15 --max-time 120 --request POST \
              --header "Authorization: Bearer $BACKUP_TRIGGER_TOKEN" "$BACKUP_TRIGGER_URL" || true)"
            if [ "$status" = "200" ]; then
              node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(p.success!==true || !/^[a-f0-9]{64}$/i.test(p.sha256||"") || !Number.isSafeInteger(p.bytes) || p.bytes<1 || p.bytes>450*1024*1024) process.exit(1); require("node:fs").writeFileSync(process.env.GITHUB_OUTPUT,"bytes="+p.bytes+"\nsha256="+p.sha256+"\n"+ "completed_at="+p.completedAt+"\n",{flag:"a"}); console.log("Encrypted backup ready; size "+p.bytes+" bytes; "+p.completedAt);' "$response_file"
              exit 0
            fi
            if [ "$status" = "401" ] || [ "$status" = "404" ]; then
              echo "::error::Backup trigger authorization/configuration failed (HTTP $status)."
              exit 1
            fi
            echo "Backup endpoint not ready (attempt $attempt/8, HTTP ${status:-no response}); retrying."
            sleep 20
          done
          echo "::error::SecureID did not confirm an encrypted backup after 8 attempts."
          exit 1

      - name: Download encrypted backup from SecureID
        env:
          BACKUP_TRIGGER_TOKEN: ${{ secrets.SECUREID_BACKUP_TRIGGER_TOKEN }}
          BACKUP_DOWNLOAD_URL: https://secureid-production-b732.up.railway.app/api/internal/backup/download
          EXPECTED_BYTES: ${{ steps.backup.outputs.bytes }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offsite-backup
          curl --fail --silent --show-error --connect-timeout 15 --max-time 600 \
            --header "Authorization: Bearer $BACKUP_TRIGGER_TOKEN" \
            "$BACKUP_DOWNLOAD_URL" --output offsite-backup/secureid-encrypted.backup.json
          actual_bytes="$(wc -c < offsite-backup/secureid-encrypted.backup.json | tr -d ' ')"
          if [ "$actual_bytes" != "$EXPECTED_BYTES" ]; then
            echo "::error::Downloaded backup size does not match the server-confirmed size."
            exit 1
          fi
          if ! node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(p.version!==2 || !p.iv || !p.tag || !p.data || !/^[a-f0-9]{64}$/i.test(p.sha256||"")) process.exit(1);' offsite-backup/secureid-encrypted.backup.json; then
            echo "::error::Downloaded file is not a valid encrypted SecureID backup envelope."
            exit 1
          fi
          sha256sum offsite-backup/secureid-encrypted.backup.json | tee offsite-backup/SHA256SUMS

      - name: Store encrypted backup as a short-lived private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureid-encrypted-backup-${{ github.run_id }}
          path: offsite-backup/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
