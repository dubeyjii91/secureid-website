name: Build SecureID Android APK (EAS signed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/secureid-android-eas.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Authenticate Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub repository secret EXPO_TOKEN is not configured."
            exit 1
          fi
          npx eas-cli whoami

      - name: Build Android preview APK using EAS-managed signing credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download completed EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e "const x=JSON.parse(require('fs').readFileSync('eas-build.json','utf8')); const b=Array.isArray(x)?x[0]:(x.build??x); const id=b?.id??b?.build?.id; if(!id) { console.error(JSON.stringify(x).slice(0,2000)); process.exit(1); } process.stdout.write(id);")"
          echo "Downloading EAS build: $BUILD_ID"
          DOWNLOAD_OUTPUT="$(npx eas-cli build:download --build-id "$BUILD_ID" --non-interactive 2>&1)" || {
            echo "$DOWNLOAD_OUTPUT"
            exit 1
          }
          echo "$DOWNLOAD_OUTPUT"
          # EAS CLI appends an escaped newline in some runner versions; match only through .apk.
          APK="$(echo "$DOWNLOAD_OUTPUT" | sed -n 's/.*Build downloaded to \(.*\.apk\).*/\1/p' | tail -n 1)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::EAS download completed but the reported APK path could not be found."
            exit 1
          fi
          cp "$APK" ./secureid-preview.apk

      - name: Verify APK exists
        run: test -s ./secureid-preview.apk

      - name: Upload EAS-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: secureid-android-eas-preview-apk
          path: mobile/secureid-preview.apk
          if-no-files-found: error
          retention-days: 14
