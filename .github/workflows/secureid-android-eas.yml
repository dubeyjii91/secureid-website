name: Build SecureID Android APK (EAS signed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Authenticate Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub repository secret EXPO_TOKEN is not configured."
            exit 1
          fi
          npx eas-cli whoami

      - name: Build Android preview APK using EAS-managed signing credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download completed EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e "const b=require('./eas-build.json'); process.stdout.write(b.id)")"
          test -n "$BUILD_ID"
          npx eas-cli build:download --build-id "$BUILD_ID" --non-interactive
          APK="$(find . -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" ./secureid-preview.apk

      - name: Verify APK exists
        run: test -s ./secureid-preview.apk

      - name: Upload EAS-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: secureid-android-eas-preview-apk
          path: mobile/secureid-preview.apk
          if-no-files-found: error
          retention-days: 14
