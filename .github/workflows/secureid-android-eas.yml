name: Build SecureID Android APK (EAS signed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Authenticate Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub repository secret EXPO_TOKEN is not configured."
            exit 1
          fi
          npx eas-cli whoami

      - name: Build Android preview APK with EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait

      - name: Download completed EAS APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build:download --latest --platform android --output ./secureid-preview.apk

      - name: Verify APK exists
        run: test -s ./secureid-preview.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: secureid-android-eas-preview-apk
          path: mobile/secureid-preview.apk
          if-no-files-found: error
          retention-days: 14
